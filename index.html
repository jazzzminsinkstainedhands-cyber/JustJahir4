<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
</head>
<body style="background-color: black;">
    <p style="color: green; font-family: monospace;">Loading secure connection...</p>

    <script>
     
      if (document.referrer.includes("bandcamp.com") && window.top === window.self) {
        
      
        window.open("arktech console.html", "_blank");
        
        window.history.back();
        
      } else {
       
        window.location.href = "arktech console.html";
      }
    </script>
</body>
</html>
