<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arktech Console</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --shell: #d9d9dc;
      --screen-bg: #eff4f6;
      --line: #7e7f84;
      --mint: #8fc2a0;
      --purple: #c7a8cc;
      --pink: #f7b7d9;
      --green: #57ff9e;
      --turq: #67efff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
      background: #cfd0d3;
      overflow: hidden;
      padding: 10px;
    }

    .console-shell {
      width: min(1020px, 96vw);
      height: min(620px, 94vh);
      background: var(--shell);
      border: 1px solid #9a9ba0;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(40, 42, 50, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .screen {
      position: absolute;
      left: 56px;
      right: 56px;
      top: 48px;
      bottom: 100px;
      border-radius: 82px;
      border: 1px solid var(--line);
      background: #f4f7f8;
      overflow: visible;
      box-shadow: inset 0 -14px 24px rgba(0, 0, 0, 0.05);
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 50%, rgba(0, 0, 0, 0.06) 51%);
      background-size: 100% 3px;
      opacity: 0.2;
      mix-blend-mode: multiply;
    }

    .screen-safe {
      position: absolute;
      inset: 16px 18px;
      border-radius: 60px;
      overflow: hidden;
      border: 1px solid #dde2e6;
      background: #f5f7fa;
    }

    .screen-safe.off .desktop {
      opacity: 0;
      pointer-events: none;
    }

    .screen-safe.off::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #000000;
      z-index: 9;
      pointer-events: none;
    }

    .boot-splash {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 10;
      pointer-events: none;
      flex-direction: column;
      gap: 12px;
    }

    .boot-splash.show {
      display: flex;
    }

    .boot-splash.goodbye {
      display: flex;
      animation: fade-goodbye 1.3s ease forwards;
    }

    .boot-logo {
      color: #67efff;
      font-size: clamp(24px, 5vw, 46px);
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 0 14px rgba(103, 239, 255, 0.9);
    }

    .boot-sub {
      color: #57ff9e;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .desktop {
      position: relative;
      height: 100%;
      background: #f5f7fa;
      padding: 10px 12px 14px;
    }

    .desktop.glitching {
      animation: glitch 0.2s steps(2) 1;
    }

    .topbar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #c8ccd1;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 10px;
    }

    .topbar-title {
      color: #6f6788;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 6px rgba(103, 239, 255, 0.35);
    }

    .topbar-clock {
      color: #6a6482;
      font-weight: 700;
      border: 1px solid #d8cbe2;
      border-radius: 8px;
      padding: 2px 8px;
      background: #ffffff;
    }

    .workspace {
      padding: 16px 10px;
      position: relative;
    }

    .file-icon {
      width: 118px;
      border: 1px solid #d8cbe2;
      background: #ffffff;
      color: #70688b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 11px 10px;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(111, 103, 136, 0.14);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .file-icon:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(103, 239, 255, 0.35);
    }

    .icon {
      font-size: 42px;
      filter: drop-shadow(0 0 7px rgba(103, 239, 255, 0.45));
    }

    .label {
      font-size: 13px;
      font-weight: 700;
      color: #73698f;
      background: #ffffff;
      border: 1px solid #f2c8df;
      border-radius: 6px;
      padding: 2px 8px;
    }

    .ascii-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ascii-face {
      position: absolute;
      font-weight: 800;
      color: #6f6788;
      text-shadow: 0 0 8px rgba(103, 239, 255, 0.4);
      animation: float-fade 1.6s ease forwards;
      white-space: pre;
    }

    .center-button {
      appearance: none;
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      min-width: 350px;
      height: 42px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(90deg, #c7a8cc, #f7b7d9);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 3px 0 rgba(111, 103, 136, 0.3);
      text-transform: lowercase;
    }

    .center-button.power-off {
      background: linear-gradient(90deg, #7f8092, #9fa0ad);
      color: #f1f2f4;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 3px 0 rgba(82, 83, 93, 0.45);
    }

    .led-bank {
      position: absolute;
      right: 22px;
      top: 20px;
      display: flex;
      gap: 8px;
    }

    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 1px rgba(140, 141, 147, 0.3);
    }

    .led.green { background: #57ff9e; box-shadow: 0 0 10px rgba(87, 255, 158, 0.75); }
    .led.turq { background: #67efff; box-shadow: 0 0 10px rgba(103, 239, 255, 0.75); }
    .led.pink { background: #f7b7d9; box-shadow: 0 0 10px rgba(247, 183, 217, 0.75); }

    .led.off {
      background: #5f6169;
      box-shadow: none;
      border-color: rgba(255, 255, 255, 0.45);
      opacity: 0.6;
    }

    .center-button:active {
      transform: translateX(-50%) translateY(1px);
    }

    .left-accent {
      appearance: none;
      position: absolute;
      left: 18px;
      bottom: 18px;
      width: 135px;
      height: 115px;
      background: linear-gradient(135deg, #9beabf, #6fffaf);
      clip-path: polygon(0 0, 100% 100%, 0 100%);
      border-radius: 8px 0 8px 8px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 3px 0 rgba(95, 116, 105, 0.35);
      cursor: pointer;
    }

    .left-accent.power-off {
      background: linear-gradient(135deg, #9b9da8, #7f828f);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 3px 0 rgba(82, 84, 93, 0.45);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .left-accent:active,
    .center-button:active {
      filter: brightness(0.95);
    }

    .right-lines {
      position: absolute;
      right: -2px;
      bottom: 38px;
      width: 290px;
      height: 60px;
      pointer-events: none;
    }

    .line {
      position: absolute;
      right: 0;
      height: 1px;
      background: #8e9094;
      width: 250px;
    }

    .line.one { top: 10px; }
    .line.two { top: 22px; width: 270px; }
    .line.three { top: 34px; width: 292px; }

    .node {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
    }

    .node.one { right: 176px; top: 5px; }
    .node.two { right: 112px; top: 17px; }

    @media (max-width: 900px) {
      .console-shell {
        height: 95vh;
      }

      .screen {
        left: 24px;
        right: 24px;
        top: 26px;
        bottom: 100px;
        border-radius: 48px;
      }

      .screen-safe {
        inset: 10px 12px;
        border-radius: 40px;
      }

      .topbar {
        padding: 0 12px;
      }

      .center-button {
        min-width: min(300px, 62vw);
      }
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(200, 204, 209, 0.65);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .hidden { display: none; }

    .modal-window {
      width: min(420px, 90%);
      background: #ffffff;
      color: #6c6388;
      border: 2px solid #d8cbe2;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 16px 30px rgba(107, 100, 130, 0.22);
    }

    .modal-titlebar {
      padding: 10px 14px;
      background: linear-gradient(90deg, var(--turq), var(--purple), var(--pink));
      border-bottom: 1px solid #d8cbe2;
    }

    .modal-titlebar h2 {
      margin: 0;
      color: #ffffff;
      font-size: 15px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .modal-content {
      padding: 16px 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      padding: 0 14px 14px;
    }

    .accept-btn {
      border: 1px solid #57ff9e;
      background: #57ff9e;
      color: #21474b;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, 0); }
      100% { transform: translate(0); }
    }

    @keyframes float-fade {
      0% { opacity: 0; transform: translateY(8px) scale(0.9); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-26px) scale(1.06); }
    }

    @keyframes fade-goodbye {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="console-shell">
    <div class="led-bank" aria-hidden="true">
      <span class="led green"></span>
      <span class="led turq"></span>
      <span class="led pink"></span>
    </div>

    <div class="screen">
      <div class="screen-safe">
        <div class="boot-splash" id="bootSplash" aria-hidden="true">
          <div class="boot-logo">ARKTECH</div>
          <div class="boot-sub" id="bootSub">boot sequence</div>
        </div>
        <main class="desktop">
          <header class="topbar">
            <span class="topbar-title">ARKTECH</span>
            <span class="topbar-clock" id="clock"></span>
          </header>

          <section class="workspace">
            <button class="file-icon" id="thatPlaceIcon" aria-label="Abrir that place">
              <span class="icon">📁</span>
              <span class="label">that place</span>
            </button>
            <div class="ascii-layer" id="asciiLayer"></div>
          </section>

          <div class="modal-backdrop hidden" id="errorModal" role="dialog" aria-modal="true" aria-labelledby="errorTitle">
            <div class="modal-window">
              <div class="modal-titlebar">
                <h2 id="errorTitle">System Error</h2>
              </div>
              <div class="modal-content">
                <p><strong>Path not found.</strong></p>
                <p>That place doesn't exist and you have to accept it.</p>
              </div>
              <div class="modal-actions">
                <button id="acceptBtn" class="accept-btn">Accept</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <button class="left-accent" type="button" aria-label="Boton verde decorativo"></button>
    <button class="center-button" id="powerButton" type="button" aria-label="Boton de encendido"></button>

    <div class="right-lines" aria-hidden="true">
      <span class="line one"></span>
      <span class="line two"></span>
      <span class="line three"></span>
      <span class="node one"></span>
      <span class="node two"></span>
    </div>
  </div>

  <script>
    // ===== JSR SOUND SYSTEM SIMPLIFICADO =====
    class JSRSoundSystem {
      constructor() {
        this.audioContext = null;
        this.masterVolume = 0.12;
      }

      getContext() {
        if (!this.audioContext) {
          try {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            console.log('Audio no disponible');
            return null;
          }
        }
        return this.audioContext;
      }

      playTone(frequency, duration, volume, wave = 'sine') {
        const ctx = this.getContext();
        if (!ctx) return;

        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = wave;
          osc.frequency.setValueAtTime(frequency, now);
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + duration / 1000);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + duration / 1000);
        } catch (e) {
          console.log('Error al reproducir sonido:', e);
        }
      }

      // Sonidos JSR Style
      powerOn() {
        this.playTone(300, 100, this.masterVolume * 0.6, 'sine');
        setTimeout(() => this.playTone(500, 100, this.masterVolume * 0.6, 'sine'), 80);
        setTimeout(() => this.playTone(800, 150, this.masterVolume * 0.7, 'sine'), 160);
      }

      powerOff() {
        this.playTone(800, 100, this.masterVolume * 0.6, 'sine');
        setTimeout(() => this.playTone(500, 100, this.masterVolume * 0.6, 'sine'), 80);
        setTimeout(() => this.playTone(300, 150, this.masterVolume * 0.7, 'sine'), 160);
      }

      click() {
        this.playTone(600, 60, this.masterVolume * 0.5, 'triangle');
      }

      error() {
        this.playTone(200, 150, this.masterVolume * 0.5, 'square');
        setTimeout(() => this.playTone(150, 150, this.masterVolume * 0.5, 'square'), 100);
      }

      accept() {
        this.playTone(500, 80, this.masterVolume * 0.5, 'sine');
        setTimeout(() => this.playTone(700, 80, this.masterVolume * 0.5, 'sine'), 60);
        setTimeout(() => this.playTone(900, 100, this.masterVolume * 0.6, 'sine'), 120);
      }

      greenButton() {
        this.playTone(550, 100, this.masterVolume * 0.5, 'sine');
        setTimeout(() => this.playTone(700, 80, this.masterVolume * 0.5, 'sine'), 70);
      }

      boot() {
        this.playTone(400, 120, this.masterVolume * 0.5, 'sine');
        setTimeout(() => this.playTone(600, 120, this.masterVolume * 0.5, 'sine'), 100);
        setTimeout(() => this.playTone(800, 150, this.masterVolume * 0.6, 'sine'), 200);
      }
    }

    // Inicializar
    const soundSystem = new JSRSoundSystem();

    // ===== CÓDIGO ORIGINAL =====
    const iconButton = document.getElementById("thatPlaceIcon");
    const errorModal = document.getElementById("errorModal");
    const acceptBtn = document.getElementById("acceptBtn");
    const clock = document.getElementById("clock");
    const desktop = document.querySelector(".desktop");
    const screenSafe = document.querySelector(".screen-safe");
    const greenButton = document.querySelector(".left-accent");
    const powerButton = document.getElementById("powerButton");
    const bootSplash = document.getElementById("bootSplash");
    const bootSub = document.getElementById("bootSub");
    const leds = document.querySelectorAll(".led");
    const asciiLayer = document.getElementById("asciiLayer");
    const asciiFaces = ["(>_<)", "(^_^)", "(T_T)", "(o_O)", "(¬‿¬)", "(~_~;)", "(づ｡◕‿‿◕｡)づ", "x_x", ":3", "(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧"];
    let isPoweredOn = false;

    function showErrorModal() {
      if (!isPoweredOn || bootSplash.classList.contains("show")) return;
      soundSystem.error();
      desktop.classList.add("glitching");
      errorModal.classList.remove("hidden");
      setTimeout(() => desktop.classList.remove("glitching"), 200);
    }

    function closeErrorModal() {
      soundSystem.click();
      errorModal.classList.add("hidden");
    }

    function updateClock() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function runBootSequence() {
      soundSystem.boot();
      bootSplash.classList.remove("goodbye");
      bootSub.textContent = "boot sequence";
      screenSafe.classList.remove("off");
      bootSplash.classList.add("show");
      setTimeout(() => {
        bootSplash.classList.remove("show");
      }, 1300);
    }

    function runShutdownSequence() {
      soundSystem.powerOff();
      bootSplash.classList.remove("show");
      bootSplash.classList.add("goodbye");
      bootSub.textContent = "bay :)";
      setTimeout(() => {
        bootSplash.classList.remove("goodbye");
      }, 1300);
    }

    function applyPowerState({ silentOff = false } = {}) {
      screenSafe.classList.toggle("off", !isPoweredOn);
      powerButton.classList.toggle("power-off", !isPoweredOn);
      greenButton.classList.toggle("power-off", !isPoweredOn);
      leds.forEach((led) => led.classList.toggle("off", !isPoweredOn));
      if (!isPoweredOn) {
        closeErrorModal();
        if (silentOff) {
          bootSplash.classList.remove("show");
          bootSplash.classList.remove("goodbye");
        } else {
          runShutdownSequence();
        }
      }
    }

    iconButton.addEventListener("dblclick", showErrorModal);
    acceptBtn.addEventListener("click", closeErrorModal);
    powerButton.addEventListener("click", () => {
      soundSystem.click();
      isPoweredOn = !isPoweredOn;
      applyPowerState();
      if (isPoweredOn) {
        runBootSequence();
      }
    });

    greenButton.addEventListener("click", () => {
      if (!isPoweredOn) return;
      soundSystem.greenButton();
      const face = document.createElement("span");
      face.className = "ascii-face";
      face.textContent = asciiFaces[Math.floor(Math.random() * asciiFaces.length)];
      face.style.left = `${14 + Math.random() * 72}%`;
      face.style.top = `${20 + Math.random() * 58}%`;
      face.style.fontSize = `${14 + Math.random() * 10}px`;
      asciiLayer.appendChild(face);
      setTimeout(() => face.remove(), 1700);
    });

    errorModal.addEventListener("click", (event) => {
      if (event.target === errorModal) closeErrorModal();
    });

    updateClock();
    setInterval(updateClock, 1000);
    applyPowerState({ silentOff: true });
    
 


  </script>

</body>
</html>
